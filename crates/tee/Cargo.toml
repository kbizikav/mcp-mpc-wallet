[package]
name = "mw-tee"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Development mock (no TEE). Never enable in production builds
insecure-mock = []
# Seal with KMS (with attestation) inside a Nitro Enclave
nitro = ["dep:aes-gcm", "dep:base64", "dep:rand_core", "dep:aws-nitro-enclaves-nsm-api"]
# Verify Nitro Enclave attestation documents (A's side)
attest-verify = ["dep:attestation-doc-validation", "dep:base64", "dep:hex"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
attestation-doc-validation = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
base64 = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aws-nitro-enclaves-nsm-api = { workspace = true, optional = true }
serde_bytes = "0.11"

[dev-dependencies]
mw-tee = { path = ".", features = ["insecure-mock", "nitro", "attest-verify"] }

[lints]
workspace = true
