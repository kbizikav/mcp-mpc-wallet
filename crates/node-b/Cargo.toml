[package]
name = "mw-node-b"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Allows registering policies without passkey verification (tests and development until M5; never enable in production)
unverified-policy = []

[dependencies]
alloy-consensus.workspace = true
alloy-primitives = { workspace = true, features = ["k256"] }
mw-audit.workspace = true
mw-chain.workspace = true
mw-core.workspace = true
mw-judge.workspace = true
mw-mpc.workspace = true
mw-policy.workspace = true
mw-simulator.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
alloy-sol-types.workspace = true
mw-http.workspace = true
mw-node-b = { path = ".", features = ["unverified-policy"] }
mw-policy = { workspace = true, features = ["software-passkey"] }
mw-mpc = { workspace = true, features = ["insecure-test-signer"] }
reqwest.workspace = true
secrecy.workspace = true

[lints]
workspace = true
