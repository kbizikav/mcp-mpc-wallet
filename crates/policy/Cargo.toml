[package]
name = "mw-policy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Development software passkey (the private key sits in a file). Only a stand-in for a real passkey
software-passkey = ["dep:rand_core"]

[dependencies]
alloy-primitives.workspace = true
base64.workspace = true
mw-core.workspace = true
p256.workspace = true
rand_core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
mw-policy = { path = ".", features = ["software-passkey"] }

[lints]
workspace = true
