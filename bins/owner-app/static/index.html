<!doctype html>
<html lang="en">
<head>

<body data-mode="loading">
  <div id="host-warning" class="banner warn global hidden">
    Open this page at <a href="http://localhost:8787">http://localhost:8787</a> — passkeys are bound to <code>localhost</code>.

  <!-- First-run setup -->
  <div id="setup" class="setup">

      <div id="setup-body" class="setup-card"></div>

  <div id="shell" class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo"></span><span>MCP MPC Wallet</span></div>

    <div class="content">
