[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
mw-core = { path = "crates/core" }
mw-audit = { path = "crates/audit" }
mw-tee = { path = "crates/tee" }
mw-mpc = { path = "crates/mpc" }
mw-simulator = { path = "crates/simulator" }
mw-judge = { path = "crates/judge" }
mw-chain = { path = "crates/chain" }
mw-node-b = { path = "crates/node-b" }

alloy-consensus = { version = "2.5", default-features = false, features = ["std", "serde"] }
alloy-eips = { version = "2.5", default-features = false, features = ["std", "serde"] }
alloy-primitives = { version = "1.7", features = ["serde"] }
alloy-rlp = "0.3"
alloy-sol-types = "1.7"
cggmp21 = { version = "0.6.3", features = ["curve-secp256k1"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Paillier/ZK の計算はデバッグビルドだと遅すぎるので、依存 crate だけ最適化する
[profile.dev.package."*"]
opt-level = 3
