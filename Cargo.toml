[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
mw-core = { path = "crates/core" }
mw-audit = { path = "crates/audit" }
mw-tee = { path = "crates/tee" }
mw-mpc = { path = "crates/mpc" }
mw-simulator = { path = "crates/simulator" }
mw-judge = { path = "crates/judge" }
mw-chain = { path = "crates/chain" }
mw-http = { path = "crates/http" }
mw-node-b = { path = "crates/node-b" }
mw-wire = { path = "crates/wire" }
mw-policy = { path = "crates/policy" }
mw-node-a = { path = "bins/node-a" }

alloy-consensus = { version = "2.5", default-features = false, features = ["std", "serde"] }
alloy-dyn-abi = { version = "1.7", features = ["eip712"] }
alloy-eips = { version = "2.5", default-features = false, features = ["std", "serde"] }
alloy-primitives = { version = "1.7", features = ["serde"] }
alloy-rlp = "0.3"
alloy-sol-types = "1.7"
age = "0.12"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
cggmp21 = { version = "0.6.3", features = ["curve-secp256k1"] }
futures = "0.3"
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = { version = "0.7", features = ["codec"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Paillier/ZK の計算はデバッグビルドだと遅すぎるので、依存 crate だけ最適化する
[profile.dev.package."*"]
opt-level = 3
